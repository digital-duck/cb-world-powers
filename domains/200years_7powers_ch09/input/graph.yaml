domain: 200years_7powers_ch09
layout: timeline
primitives:
  uk_1945_labour_landslide_welfare_state:
    defines: |
      (1945) Labour Landslide & Welfare State — Clement Attlee's Labour government wins a
      landslide and begins building the modern welfare state, including nationalizing key
      industries.
    tier: 0
concepts:
  uk_1947_indian_independence_partition:
    composed_of:
    - uk_1945_labour_landslide_welfare_state
    defines: |
      (1947) Indian Independence & Partition — Britain grants independence to India, which is
      partitioned into India and Pakistan amid mass violence, marking the beginning of
      large-scale imperial decolonization.
    tier: 1
  uk_1948_national_health_service_founded:
    composed_of:
    - uk_1947_indian_independence_partition
    defines: |
      (1948) National Health Service Founded — The NHS launches, providing free healthcare at
      the point of use and becoming a defining institution of British national identity.
    tier: 2
  uk_1956_suez_crisis:
    composed_of:
    - uk_1948_national_health_service_founded
    defines: |
      (1956) Suez Crisis — Britain, France, and Israel invade Egypt after nationalization of
      the Suez Canal; US pressure forces a humiliating withdrawal, marking the effective end
      of Britain as an independent global power.
    tier: 3
  uk_1960_wave_decolonization:
    composed_of:
    - uk_1956_suez_crisis
    defines: |
      (1960s) Wave of Decolonization — Most remaining African and Caribbean colonies gain
      independence (Nigeria, Kenya, Jamaica, and others), rapidly winding down the British
      Empire.
    tier: 4
  uk_1973_joins_european_economic_community:
    composed_of:
    - uk_1960_wave_decolonization
    defines: |
      (1973) Joins the European Economic Community — Britain joins the EEC (precursor to the
      EU), tying its economy closely to continental Europe.
    tier: 5
  uk_1979_margaret_thatcher_becomes_pm:
    composed_of:
    - uk_1973_joins_european_economic_community
    defines: |
      (1979) Margaret Thatcher Becomes PM — Thatcher launches sweeping free-market reforms,
      privatization, and confrontations with trade unions, reshaping the British economy and
      politics.
    tier: 6
  uk_1982_falklands_war:
    composed_of:
    - uk_1979_margaret_thatcher_becomes_pm
    defines: |
      (1982) Falklands War — Britain defeats Argentina to retain the Falkland Islands,
      boosting Thatcher's domestic popularity.
    tier: 7
  uk_1984_miners_strike:
    composed_of:
    - uk_1982_falklands_war
    defines: |
      (1984–1985) Miners' Strike — A year-long, bitter strike against pit closures ends in
      defeat for the miners, symbolizing the decline of British heavy industry and union
      power.
    tier: 8
  uk_1997_tony_blair_new_labour:
    composed_of:
    - uk_1984_miners_strike
    defines: |
      (1997) Tony Blair & New Labour — Blair's Labour Party ends 18 years of Conservative
      rule; the 1998 Good Friday Agreement largely ends decades of violence in Northern
      Ireland (the Troubles).
    tier: 9
  uk_1999_scottish_welsh_devolution:
    composed_of:
    - uk_1997_tony_blair_new_labour
    defines: |
      (1999) Scottish & Welsh Devolution — New devolved parliaments/assemblies are established
      in Scotland and Wales, reshaping the UK's constitutional structure.
    tier: 10
  uk_2003_iraq_war:
    composed_of:
    - uk_1999_scottish_welsh_devolution
    defines: |
      (2003) Iraq War — Blair commits British forces alongside the US invasion of Iraq, a
      deeply controversial decision that damages his legacy.
    tier: 11
  uk_2008_global_financial_crisis:
    composed_of:
    - uk_2003_iraq_war
    defines: |
      (2008) Global Financial Crisis — Major UK banks require government bailouts; the crisis
      leads to a prolonged era of austerity policy under subsequent governments.
    tier: 12
  uk_2014_scottish_independence_referendum:
    composed_of:
    - uk_2008_global_financial_crisis
    defines: |
      (2014) Scottish Independence Referendum — Scots vote to remain in the UK (55%–45%), but
      the debate over independence remains a live political issue.
    tier: 13
  uk_2016_brexit_referendum:
    composed_of:
    - uk_2014_scottish_independence_referendum
    defines: |
      (2016) Brexit Referendum — The UK votes to leave the European Union, triggering years of
      political turmoil and negotiation.
    tier: 14
  uk_2020_brexit_completed_covid_19_pandemic:
    composed_of:
    - uk_2016_brexit_referendum
    defines: |
      (2020) Brexit Completed & COVID-19 Pandemic — The UK formally exits the EU while
      simultaneously facing a severe COVID-19 outbreak and national lockdowns.
    tier: 15
  uk_2022_death_queen_elizabeth_ii:
    composed_of:
    - uk_2020_brexit_completed_covid_19_pandemic
    defines: |
      (2022) Death of Queen Elizabeth II — After a 70-year reign, Elizabeth II dies and is
      succeeded by King Charles III, marking the end of a defining era of British monarchy.
    tier: 16
  uk_2022_truss_mini_budget_gilt_crisis:
    composed_of:
    - uk_2022_death_queen_elizabeth_ii
    defines: |
      (2022) Truss Mini-Budget & Gilt Crisis — Prime Minister Liz Truss's unfunded tax-cut
      budget triggers a bond-market crisis and sterling collapse; she resigns after 49 days,
      the shortest premiership in British history.
    tier: 17
  uk_2024_labour_landslide_under_starmer:
    composed_of:
    - uk_2022_truss_mini_budget_gilt_crisis
    defines: |
      (2024) Labour Landslide Under Starmer — Keir Starmer's Labour Party wins a large general
      election victory, ending 14 years of Conservative government.
    tier: 18
